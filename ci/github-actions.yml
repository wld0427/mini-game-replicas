# ⚠️ 这个文件放在 `ci/` 而不是 `.github/workflows/`，是有意为之。
# classic PAT 只有 `repo` scope 时，GitHub 会拒绝任何对 `.github/workflows/`
# 的写入，推送会被 remote rejected 拦下。
# 等 token 拿到 `workflow` scope 后，执行 `bash scripts/enable-ci.sh`
# 会自动把它搬进 `.github/workflows/ci.yml` 并推送。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: 静态审查 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-save playwright

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 静态代码审查
        run: node scripts/review.mjs

      - name: 运行全部测试
        run: node scripts/run-tests.mjs
