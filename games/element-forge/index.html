<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Element Forge 元素熔炉 — 元素合成小游戏</title>
<meta name="description" content="元素熔炉 Element Forge：把两个元素放进熔炉，合成新元素。收录配方、原创合成、图鉴收集与每日灵感。">
<meta name="theme-color" content="#0d1018">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d1018'/%3E%3Cpath d='M32 26h36l-5 20a21 21 0 1 1-26 0z' fill='none' stroke='%23ffc861' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#forge">跳到熔炉</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="30" height="30" focusable="false">
        <path d="M13 8h22l-3.4 13.6A12.6 12.6 0 1 1 16.4 21.6z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="24" cy="32" r="3.4" fill="currentColor"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1 id="game-title">Element Forge</h1>
      <p id="game-subtitle" class="muted">把两个元素放进熔炉，撞出新世界</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="lang-switch" role="group" id="lang-switch" aria-label="Language">
      <button type="button" data-lang="zh" class="lang-btn is-active">中文</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
      <button type="button" data-lang="ja" class="lang-btn">日本語</button>
    </div>
    <button type="button" id="reset-btn" class="ghost-btn" data-i18n="reset">重置进度</button>
  </div>
</header>

<main class="layout">
  <section class="forge-wrap" id="forge" aria-labelledby="forge-title">
    <h2 class="visually-hidden" id="forge-title">Forge</h2>

    <div class="forge">
      <div class="slots">
        <button type="button" class="slot" id="slot-a" data-slot="0" aria-describedby="hint">
          <span class="slot-label" data-i18n="slot_a">原料 A</span>
          <span class="slot-glyph" id="slot-a-glyph" aria-hidden="true">+</span>
          <span class="slot-name" id="slot-a-name">空</span>
          <span class="slot-tier" id="slot-a-tier"></span>
        </button>

        <span class="plus" aria-hidden="true">+</span>

        <button type="button" class="slot" id="slot-b" data-slot="1" aria-describedby="hint">
          <span class="slot-label" data-i18n="slot_b">原料 B</span>
          <span class="slot-glyph" id="slot-b-glyph" aria-hidden="true">+</span>
          <span class="slot-name" id="slot-b-name">空</span>
          <span class="slot-tier" id="slot-b-tier"></span>
        </button>
      </div>

      <div class="fuse-row">
        <button type="button" id="fuse-btn" class="fuse-btn" data-i18n="fuse">熔炼</button>
        <button type="button" id="clear-btn" class="ghost-btn" data-i18n="clear_forge">清空熔炉</button>
      </div>

      <p class="hint" id="hint" data-i18n="slot_hint">点击图鉴中的元素放入熔炉</p>

      <div class="result-zone" aria-live="polite">
        <article class="result-card" id="result-card" data-tier="none" hidden>
          <div class="result-glyph" id="result-glyph" aria-hidden="true">?</div>
          <div class="result-body">
            <p class="result-name" id="result-name">—</p>
            <p class="result-meta">
              <span class="tier-pill" id="result-tier">—</span>
              <span class="badge" id="result-new" hidden>NEW</span>
              <span class="badge badge-improv" id="result-improv" hidden>原创</span>
            </p>
            <p class="result-formula" id="result-formula"></p>
          </div>
        </article>
      </div>

      <dl class="stats" id="stats">
        <div class="stat"><dt data-i18n="stat_dex">图鉴</dt><dd id="stat-dex">0/0</dd></div>
        <div class="stat"><dt data-i18n="stat_fusions">熔炼</dt><dd id="stat-fusions">0</dd></div>
        <div class="stat"><dt data-i18n="stat_depth">深度</dt><dd id="stat-depth">0</dd></div>
        <div class="stat"><dt data-i18n="stat_improvised">原创</dt><dd id="stat-improvised">0</dd></div>
      </dl>

      <div class="tier-legend" id="tier-legend"></div>
    </div>
  </section>

  <aside class="side">
    <section class="panel" aria-labelledby="collection-title">
      <h2 id="collection-title" data-i18n="collection">图鉴</h2>
      <input type="search" id="search" class="search" placeholder="搜索元素…" data-i18n-attr="placeholder:search_placeholder" aria-label="Search elements">
      <div class="collection" id="collection"></div>
      <p class="muted small" id="collection-meta"></p>
    </section>

    <section class="panel" aria-labelledby="daily-title">
      <h2 id="daily-title" data-i18n="daily">每日灵感</h2>
      <button type="button" id="daily-btn" class="daily-btn" data-i18n="daily_draw">抽取灵感</button>
      <dl class="mini-stats">
        <div><dt data-i18n="daily_left">今日剩余</dt><dd id="daily-left">0</dd></div>
        <div><dt data-i18n="pity">保底</dt><dd id="daily-pity">0/12</dd></div>
      </dl>
      <p class="muted small" id="daily-hint"></p>
    </section>

    <section class="panel" aria-labelledby="ach-title">
      <h2 id="ach-title" data-i18n="achievements">成就</h2>
      <ul class="achievements" id="achievements"></ul>
    </section>

    <section class="panel" aria-labelledby="recipe-title">
      <h2 id="recipe-title" data-i18n="recipes">配方手册</h2>
      <ul class="recipes" id="recipes"></ul>
      <p class="muted small" id="recipes-empty" data-i18n="recipes_empty">熔炼成功后配方会记录在这里</p>
    </section>
  </aside>
</main>

<footer class="foot muted small">
  <span data-i18n="footer">原创实现 · 玩法致敬元素合成类网页小游戏</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
