<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripple Song 涟歌 — 波场解谜小游戏</title>
<meta name="description" content="涟歌 Ripple Song：你不能点亮目标，你只能移动波。挪动波源，用干涉把共鸣点顶到最亮。">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3Crect width='100' height='100' rx='24' fill='%23070b16'/%3Ccircle cx='50' cy='50' r='10' fill='none' stroke='%2358e0ff' stroke-width='6'/%3Ccircle cx='50' cy='50' r='24' fill='none' stroke='%23ff7ac6' stroke-width='5' opacity='.75'/%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%2358e0ff' stroke-width='3' opacity='.45'/%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#stage">跳到海面</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="30" height="30" focusable="false">
        <circle cx="32" cy="32" r="7" fill="currentColor"/>
        <circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="4" opacity=".75"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="3" opacity=".45"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1 id="game-title">Ripple Song</h1>
      <p id="game-subtitle" class="muted">你不能点亮目标，你只能移动波</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="lang-switch" role="group" id="lang-switch" aria-label="Language">
      <button type="button" data-lang="zh" class="lang-btn is-active">中文</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
      <button type="button" data-lang="ja" class="lang-btn">日本語</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="stage-wrap" id="stage" aria-labelledby="stage-title">
    <h2 class="visually-hidden" id="stage-title">Sea</h2>

    <div class="hud">
      <div class="hud-item">
        <span class="hud-label" data-i18n="time_left">剩余</span>
        <b id="hud-time">45</b>
      </div>
      <div class="hud-item">
        <span class="hud-label" data-i18n="resonance">共鸣值</span>
        <b id="hud-resonance">0%</b>
      </div>
      <div class="hud-item">
        <span class="hud-label" data-i18n="targets">共鸣点</span>
        <b id="hud-targets">0/1</b>
      </div>
    </div>

    <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter-fill"></div></div>

    <div class="sea-frame">
      <canvas class="sea" id="sea" width="160" height="90" role="img" aria-label="Wave field"></canvas>
      <div class="markers" id="markers"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <p class="overlay-title" id="overlay-title">涟歌</p>
          <p class="overlay-sub" id="overlay-sub"></p>
          <p class="overlay-hint" id="overlay-hint"></p>
          <div class="overlay-actions">
            <button type="button" id="start-btn" class="primary-btn" data-i18n="start">开始</button>
            <button type="button" id="next-btn" class="ghost-btn" data-i18n="next_level">下一关</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint" data-i18n="hint">方向键 / 拖拽移动波源，让所有共鸣点同时亮起</p>

    <div class="touch-pad" id="touch-pad" aria-hidden="true">
      <button type="button" class="pad-btn" data-dir="-1,0" aria-label="left">◀</button>
      <button type="button" class="pad-btn" data-dir="0,-1" aria-label="up">▲</button>
      <button type="button" class="pad-btn" data-dir="1,0" aria-label="right">▶</button>
      <button type="button" class="pad-btn" data-dir="0,1" aria-label="down">▼</button>
    </div>
  </section>

  <aside class="side">
    <section class="panel" aria-labelledby="how-title">
      <h2 id="how-title" data-i18n="how_to">怎么玩</h2>
      <ol class="how-list">
        <li data-i18n="how_1">共鸣点不可点击 —— 你没法直接点亮它。</li>
        <li data-i18n="how_2">波源可以随便挪。波会绕过礁石来回叠加，形成驻波。</li>
        <li data-i18n="how_3">把波源挪到某个位置，所有共鸣点会一起亮 —— 那就是解。</li>
      </ol>
    </section>

    <section class="panel" aria-labelledby="levels-title">
      <h2 id="levels-title" data-i18n="levels">关卡</h2>
      <div class="levels" id="levels"></div>
    </section>

    <section class="panel" aria-labelledby="records-title">
      <h2 id="records-title" data-i18n="records">纪录</h2>
      <div class="records" id="records"></div>
    </section>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
